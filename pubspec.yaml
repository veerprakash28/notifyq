name: notifyq
description: NotifyQ - Intelligent Reminder & Alert System for financial deductions, life events, and custom reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Dependency Injection
  get_it: ^7.7.0

  # UUID generation
  uuid: ^4.4.2

  # Date Handling
  intl: ^0.19.0

  # Icons
  flutter_svg: ^2.0.10+1

  # Timezone (required for notifications)
  timezone: ^0.9.4

  # Shared Preferences (for settings)
  shared_preferences: ^2.3.2

  # Permission handler
  permission_handler: ^11.3.1

  # Table Calendar
  table_calendar: ^3.1.2

  # Animations
  flutter_staggered_animations: ^1.1.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
